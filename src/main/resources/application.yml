server:
  port: ${SERVER_PORT:9090}
spring:
  application:
    name: angular-orders-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/internship_orders?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:orders_app}
    password: ${DB_PASSWORD:orders_dev_password}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/bootcamp-orders}
app:
  security:
    audience: ${JWT_AUDIENCE:orders-api}
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:4200}
